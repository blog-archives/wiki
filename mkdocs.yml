site_name: Knowledge Base
site_url: https://wiki.lllllan.cn/
repo_url: https://github.com/blog-archives/wiki
edit_uri: edit/main/wiki/
docs_dir: wiki
site_dir: site

hooks:
  - hooks.py

extra_css:
  - assets/mobile.css

theme:
  name: material
  language: zh
  # Sidebar is kept short: `navigation.tabs` puts each top-level directory in
  # the top bar, so the sidebar only lists the current directory. With
  # `navigation.sections` off, folders render as collapsible groups instead of
  # being force-expanded. `navigation.indexes` makes a folder's README.md its
  # landing page (linked from the section title). `awesome-pages` reads each
  # folder's `.pages` for the directory title/order while still auto-including
  # new pages.
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - search.highlight
    - content.code.copy

plugins:
  - awesome-pages
  - search:
      lang:
        - zh
        - en

not_in_nav: |
  /raw
  log.md

markdown_extensions:
  - tables
  - fenced_code
  - admonition
  - toc:
      permalink: true
